name: Build frontend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "plugin/frontend/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "plugin/frontend/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/frontend/package-lock.json

      - name: Install dependencies
        working-directory: plugin/frontend
        run: npm ci

      - name: Build
        working-directory: plugin/frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-frontend-dist
          path: plugin/frontend/dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugin/plugin.json'))['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.json version ${version}" >&2
            exit 1
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-frontend-dist
          path: plugin/frontend/dist

      - name: Stage plugin package
        run: |
          mkdir -p staging/imagenia/frontend
          cp plugin/plugin.json plugin/plugin.py plugin/requirements.txt plugin/README.md plugin/icon.svg staging/imagenia/
          cp -r plugin/frontend/dist staging/imagenia/frontend/dist
          rsync -a --exclude '__pycache__/' plugin/src/ staging/imagenia/src/

      - name: Package plugin zip
        run: |
          cd staging
          zip -r "../imagenia-${GITHUB_REF_NAME}.zip" imagenia
          cd ..
          # 平台上传限制 10MB
          size=$(stat -c%s "imagenia-${GITHUB_REF_NAME}.zip")
          if [ "${size}" -gt 10485760 ]; then
            echo "Plugin zip is ${size} bytes, exceeding the 10MB upload limit" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: imagenia-*.zip
